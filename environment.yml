name: tfm
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Análisis de datos
  - numpy=1.26.4
  - pandas=2.1.4
  - scipy=1.11.4
  - scikit-learn=1.6.1
  - xgboost=2.1.4
  # Explicabilidad y exportación de los modelos
  - shap=0.49.1
  - joblib=1.3.2
  # Visualización y reducción de dimensionalidad
  - matplotlib=3.8.2
  - umap-learn=0.5.12
  - plotly=7.1.0
  # Interfaz web
  - streamlit=1.50.0
  - pyarrow=18.1.0
  # Pruebas
  - pytest=8.3.5
  # Notebook
  - notebook
  - ipykernel=6.31.0
